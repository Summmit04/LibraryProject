<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <style>
   
    .table tbody tr {
        transition: all 0.25s ease-in-out;
    }
    .table tbody tr:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        background-color: #ffffff !important;
        position: relative;
        z-index: 5;
    }
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hover-lift { 
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out; 
        }
        .hover-lift:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15) !important; 
            cursor: pointer; 
        }

        .navbar-nav .nav-link { 
            transition: all 0.3s ease-in-out; 
            border-radius: 8px; 
        }
        .navbar-nav .nav-link:hover { 
            background-color: rgba(255, 255, 255, 0.1); 
            color: #0d6efd !important; 
            padding-left: 20px !important; 
        }

        table.table tbody tr:hover {
            background-color: #cfe2ff !important; 
            cursor: pointer !important;
        }
    </style>
</head>
<body> 

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="{% url 'admin_dashboard' %}">Home</a>

            <div class="d-flex align-items-center ms-auto">
                <button id="themeToggle" class="btn btn-sm btn-outline-light rounded-circle d-flex align-items-center justify-content-center shadow-sm me-3" style="width: 40px; height: 40px;" title="Toggle Dark Mode">
                    <span id="themeIcon" style="font-size: 18px;">🌙</span>
                </button>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse w-100" id="navbarContent">
                <ul class="navbar-nav text-center mt-3">
                    <li class="nav-item py-2 border-bottom border-secondary">
                        <a class="nav-link text-white fs-4" href="{% url 'manage_books' %}">Manage Books</a>
                    </li>
                    <li class="nav-item py-2 border-bottom border-secondary">
                        <a class="nav-link text-white fs-4" href="{% url 'add_book' %}">Add Book</a>
                    </li>
                    <li class="nav-item py-2 border-bottom border-secondary">
                        <a class="nav-link text-white fs-4" href="{% url 'issue_book' %}">Issue Book</a>
                    </li>
                    <li class="nav-item py-2 border-bottom border-secondary">
                        <a class="nav-link text-white fs-4" href="{% url 'manage_issued_books' %}">Issued Books</a>
                    </li>
                    <li class="nav-item py-2 border-bottom border-secondary">
                        <a class="nav-link text-white fs-4" href="{% url 'manage_students' %}">Students Profile</a>
                    </li>
                    <li class="nav-item py-2">
                        <a class="nav-link text-danger fw-bold fs-4" href="{% url 'user_logout' %}">Logout ({{ user.username }})</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        
        {% if messages %}
            <div class="mt-3">
                {% for message in messages %}
                    <div class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const htmlElement = document.documentElement;
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const savedTheme = localStorage.getItem('library_theme') || 'light';
            
            htmlElement.setAttribute('data-bs-theme', savedTheme);
            themeIcon.textContent = savedTheme === 'light' ? '🌙' : '☀️';

            themeToggle.addEventListener('click', () => {
                const newTheme = htmlElement.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
                htmlElement.setAttribute('data-bs-theme', newTheme);
                localStorage.setItem('library_theme', newTheme);
                themeIcon.textContent = newTheme === 'light' ? '🌙' : '☀️';
            });

            const navLinks = document.querySelectorAll('.nav-link');
            const navCollapse = document.getElementById('navbarContent');
            const bsCollapse = new bootstrap.Collapse(navCollapse, { toggle: false });
            
            navLinks.forEach(link => {
                link.addEventListener('click', () => { bsCollapse.hide(); });
            });
        });
    </script>
</body>
</html>
