{% extends 'library/base.html' %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="card shadow border-0 mb-4 hover-lift">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0 fw-bold">Add New Book</h4>
        </div>

        <div class="card-body p-4">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Book Title:</label>
                    <input type="text" name="title" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Category Name:</label>
                    <input type="text" name="category_name" class="form-control" required>
                    <small class="text-muted">Type any category name. If new, it will be created automatically.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Author Name:</label>
                    <input type="text" name="author_name" class="form-control" required>
                    <small class="text-muted">Type author name directly here.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">ISBN Number:</label>
                    <input type="text" name="isbn_number" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Price (₹):</label>
                    <input type="number" step="0.01" name="price" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Copies Available:</label>
                    <input type="number" name="copies_available" value="1" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Cover Image:</label>
                    <input type="file" name="cover_image" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Description:</label>
                    <textarea name="description" class="form-control" rows="4"></textarea>
                </div>

                <button type="submit" class="btn btn-primary px-4 py-2 fw-bold">Save Book</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
