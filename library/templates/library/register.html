<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Portal - Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .register-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .register-header-bg {
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
        }

        .register-form p {
            margin-bottom: 0.6rem;
        }
        .register-form label {
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 0.15rem;
            color: var(--bs-secondary-color);
        }
        .register-form input {
            display: block;
            width: 100%;
            padding: 0.35rem 0.65rem;
            font-size: 0.85rem;
            border-radius: 0.375rem;
            border: 1px solid var(--bs-border-color);
            background-color: var(--bs-tertiary-bg);
            color: var(--bs-body-color);
        }
        .register-form input:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }
        
        .register-form .helptext, 
        .register-form span.helptext {
            display: block;
            font-size: 0.72rem;
            color: var(--bs-secondary-color);
            margin-top: 0.15rem;
        }
        .register-form ul {
            padding-left: 1rem;
            margin-bottom: 0.3rem;
            margin-top: 0.15rem;
            font-size: 0.72rem;
            color: var(--bs-secondary-color);
        }
        .register-form li {
            margin-bottom: 0.05rem;
        }

        .register-card a.hover-link {
            color: #0d6efd !important;
            text-decoration: none !important;
            transition: all 0.2s ease-in-out !important;
            display: inline-block;
        }
        .register-card a.hover-link:hover {
            color: #0a58ca !important;
            text-decoration: underline !important;
            text-underline-offset: 4px !important;
            transform: translateY(-2px) !important;
        }
    </style>
</head>
<body class="bg-body-secondary d-flex align-items-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-9 col-md-7 col-lg-5">
                <div class="card register-card bg-body">
                    
                    <div class="register-header-bg p-3 text-center text-white">
                        <i class="bi bi-person-plus-fill fs-3 mb-1"></i>
                        <h4 class="fw-bold mb-0">Registration</h4>
                        <p class="small text-white-50 mb-0" style="font-size: 0.78rem;">Create your library account</p>
                    </div>

                    <div class="card-body p-3 p-sm-4">
                        <form method="POST" action="" class="register-form">
                            {% csrf_token %}
                            
                            {{ form.as_p }}

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm text-uppercase mt-2" style="letter-spacing: 0.5px; font-size: 0.85rem;">
                                Create Account
                            </button>
                        </form>

                        <!-- Navigation Link -->
                        <div class="text-center mt-3 pt-2 border-top">
                            <p class="small text-body-secondary mb-0" style="font-size: 0.8rem;">
                                Already have an account? 
                                <a href="{% url 'user_login' %}" class="fw-bold hover-link">Log in here</a>
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
