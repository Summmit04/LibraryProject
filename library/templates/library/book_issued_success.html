{% extends 'library/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 text-center">
            
            <!-- Success Card with Project Primary Blue Theme -->
            <div class="card shadow-lg border-0 bg-primary text-white rounded-4 p-4 p-md-5 my-5">
                <div class="card-body">
                    <!-- Icon -->
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill display-1 text-white"></i>
                    </div>
                    
                    <!-- Heading -->
                    <h2 class="fw-bold mb-3 text-white">Book Issued Successfully!</h2>
                    <p class="lead mb-4 text-white-50" style="font-size: 1rem;">
                        The selected book has been successfully assigned to the student.
                    </p>
                    
                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <a href="{% url 'issue_book' %}" class="btn btn-light text-primary fw-bold px-4 py-2 shadow-sm">
                            <i class="bi bi-plus-circle me-1"></i> Issue Another Book
                        </a>
                        <a href="{% url 'manage_issued_books' %}" class="btn btn-outline-light fw-bold px-4 py-2">
                            <i class="bi bi-list-ul me-1"></i> View Issued Books List
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
