<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .login-card {
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .login-header-bg {
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
        }
        .form-control:focus {
            box-shadow: none;
        }
        .input-group:focus-within {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
            border-radius: 0.375rem;
        }
        .toggle-password {
            cursor: pointer;
            user-select: none;
        }
        .hover-link {
            transition: all 0.2s ease-in-out;
            display: inline-block;
            text-decoration: none;
        }
        .hover-link:hover {
            color: #0a58ca !important;
            text-decoration: underline !important;
            text-underline-offset: 4px;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-body-secondary d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card login-card bg-body">
                    
                    <div class="login-header-bg p-4 text-center text-white">
                        <div class="mb-2">
                            <i class="bi bi-book-half display-5"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Library Portal</h3>
                        <p class="small text-white-50 mb-0">Sign in to manage your account</p>
                    </div>

                    <div class="card-body p-4 p-sm-5">
                        {% if form.errors %}
                            <div class="alert alert-danger alert-dismissible fade show small py-2 mb-4" role="alert">
                                <i class="bi bi-exclamation-circle-fill me-2"></i>
                                Invalid username or password.
                                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endif %}

                        <form method="POST" action="">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="id_username" class="form-label fw-semibold text-body-secondary small">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary border-end-0 text-body-secondary">
                                        <i class="bi bi-person-fill"></i>
                                    </span>
                                    <input type="text" name="username" id="id_username" class="form-control bg-body-tertiary border-start-0 ps-0" placeholder="Enter username" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="id_password" class="form-label fw-semibold text-body-secondary small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary border-end-0 text-body-secondary">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" name="password" id="id_password" class="form-control bg-body-tertiary border-start-0 border-end-0 px-0" placeholder="Enter password" required>
                                    <button type="button" class="input-group-text bg-body-tertiary border-start-0 text-body-secondary toggle-password" id="togglePassword">
                                        <i class="bi bi-eye-slash" id="toggleIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm text-uppercase" style="letter-spacing: 0.5px;">
                                Log In
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="small text-body-secondary mb-0">
                                Don't have an account? 
                                <a href="{% url 'register' %}" class="fw-bold text-primary hover-link">Register here</a>
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePasswordBtn = document.querySelector('#togglePassword');
            const passwordInput = document.querySelector('#id_password');
            const toggleIcon = document.querySelector('#toggleIcon');

            if (togglePasswordBtn && passwordInput && toggleIcon) {
                togglePasswordBtn.addEventListener('click', function() {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    
                    if (isPassword) {
                        toggleIcon.classList.remove('bi-eye-slash');
                        toggleIcon.classList.add('bi-eye');
                    } else {
                        toggleIcon.classList.remove('bi-eye');
                        toggleIcon.classList.add('bi-eye-slash');
                    }
                });
            }
        });
    </script>
</body>
</html>
